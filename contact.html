<h2 class="contact-h"><u>Input your info here:</u></h2>
	
<form action="https://formsubmit.co/jianpagum03@gmail.com" method="POST" id="contact-form">
	
<label>Full Name:</label>
<input type="text" name="Name" required>
<br><br>
<label>Email:</label>
<input required type="email" name="Email">
<br><br>
<label>Gender:</label>
<input type="radio" name="Gender" value="male" checked>
Male
<input type="radio" name="Gender" value="female">
Female
<input type="radio" name="Gender" value="other" checked>
Other
<br><br>
<label>Interests:</label>
<input type="checkbox" name="Interest 1" value="HTML">
HTML
<input type="checkbox" name="Interest 2" value="Cosplaying">
Cosplaying
<input type="checkbox" name="Interest 3" value="Badminton">
Badminton
<br><br>
<label>Purpose of Visit:</label>

<option value="General Inquiry">General Inquiry</option>
<option value="Feedback">Feedback</option>
<option value="Collaboration">Collaboration</option>
<option value="School Project">School Project</option>
</select>
<br><br>

<input type="color" width="300" name="Color" required>
<br><br>
<label>Favorite Number:</label>
<input type="number" name="Number" required>
<br><br>
<label>Comments:</label>
<textarea rows="5" cols="30" name="Comments" placeholder="Place your comments here!" required></textarea>
<br><br>
